[project]
name = "stellar-sense-backend"
version = "0.1.0"
description = "Stellar-Sense 后端服务：大模型驱动的高校专业自适应学习与伴学智能体（遥感学科）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "cryptography>=43.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI 惯例：依赖注入使用 `x: T = Depends(...)` 默认参数写法
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 种子数据包含大量中文长文本，无法自动折行
"app/seed/data.py" = ["E501"]
